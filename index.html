<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Свидание?</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #fbc2eb, #a6c1ee);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', sans-serif;
        }
        .screen {
            background: rgba(255,255,255,0.25);
            backdrop-filter: blur(12px);
            padding: 2rem;
            border-radius: 50px;
            text-align: center;
            width: 90%;
            max-width: 450px;
        }
        h1 {
            font-size: 1.8rem;
            color: #2c2b47;
            margin-bottom: 2rem;
        }
        .buttons {
            display: flex;
            justify-content: center;
            gap: 30px;
            flex-wrap: wrap;
        }
        button {
            font-size: 1.5rem;
            font-weight: bold;
            padding: 10px 25px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
        }
        .yes {
            background: #ffb7c5;
            color: #6b1e3a;
            box-shadow: 0 4px 0 #b34d6e;
        }
        .yes:active {
            transform: translateY(2px);
        }
        .no {
            background: #cbd5e6;
            color: #2d3e50;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(4px);
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal-content {
            background: white;
            padding: 1.8rem;
            border-radius: 40px;
            text-align: center;
            font-size: 1.3rem;
            font-weight: bold;
            color: #b13e6b;
            margin: 20px;
        }
        .modal-content button {
            margin-top: 15px;
            font-size: 1rem;
            padding: 6px 20px;
            background: #ff98b9;
            color: white;
        }
        .second-buttons {
            position: relative;
            min-height: 100px;
            display: flex;
            justify-content: center;
            gap: 30px;
        }
        .escape-btn {
            position: absolute;
            transition: left 0.08s ease, top 0.08s ease;
        }
        .back-btn {
            margin-top: 25px;
            background: rgba(255,255,200,0.8);
            font-size: 0.9rem;
            padding: 6px 18px;
        }
    </style>
</head>
<body>

<!-- Экран 1 -->
<div class="screen" id="screen1">
    <h1>✨ Ты пойдёшь со мной на свидание? ✨</h1>
    <div class="buttons">
        <button class="yes" id="btnYes1">💖 ДА</button>
        <button class="no" id="btnNo1">💩 НЕТ</button>
    </div>
</div>

<!-- Экран 2 -->
<div class="screen" id="screen2" style="display:none">
    <h1>🤔 Ты уверена со своим выбором? 🤔</h1>
    <div style="position: relative; min-height: 120px;">
        <div class="second-buttons" id="secondButtons">
            <button class="no" id="btnNo2">😿 НЕТ</button>
            <button class="yes" id="btnYes2">💖 ДА</button>
        </div>
    </div>
    <button class="back-btn" id="backBtn">⬅️ Назад</button>
</div>

<!-- Модалки -->
<div id="modalRefuse" class="modal">
    <div class="modal-content">🎉 Ура! Поздравляю с отказом (мы оба довольны) 🎉<br><button id="closeRefuse">Окей</button></div>
</div>
<div id="modalBye" class="modal">
    <div class="modal-content">👋 Окей, пока 👋<br><button id="closeBye">✌️</button></div>
</div>

<script>
    const screen1 = document.getElementById('screen1');
    const screen2 = document.getElementById('screen2');
    const btnYes1 = document.getElementById('btnYes1');
    const btnNo1 = document.getElementById('btnNo1');
    const btnNo2 = document.getElementById('btnNo2');
    const btnYes2 = document.getElementById('btnYes2');
    const backBtn = document.getElementById('backBtn');
    const container2 = document.getElementById('secondButtons');

    // Модалки
    const modalRefuse = document.getElementById('modalRefuse');
    const modalBye = document.getElementById('modalBye');
    const closeRefuse = document.getElementById('closeRefuse');
    const closeBye = document.getElementById('closeBye');

    // Кнопка НЕТ на экране 1
    btnNo1.onclick = () => modalRefuse.style.display = 'flex';
    closeRefuse.onclick = () => modalRefuse.style.display = 'none';
    modalRefuse.onclick = (e) => { if(e.target === modalRefuse) modalRefuse.style.display = 'none'; };

    // Кнопка ДА на экране 1 → экран 2
    btnYes1.onclick = () => {
        screen1.style.display = 'none';
        screen2.style.display = 'block';
        // Сброс позиции кнопки ДА на экране 2
        btnYes2.classList.remove('escape-btn');
        btnYes2.style.position = '';
        btnYes2.style.left = '';
        btnYes2.style.top = '';
    };

    // Назад
    backBtn.onclick = () => {
        screen2.style.display = 'none';
        screen1.style.display = 'block';
        btnYes2.classList.remove('escape-btn');
        btnYes2.style.position = '';
    };

    // Кнопка НЕТ на экране 2 → окей пока
    btnNo2.onclick = () => modalBye.style.display = 'flex';
    closeBye.onclick = () => modalBye.style.display = 'none';
    modalBye.onclick = (e) => { if(e.target === modalBye) modalBye.style.display = 'none'; };

    // Кнопка ДА на экране 2 — телепортируется по всему экрану
    function teleportYes() {
        if (!btnYes2.classList.contains('escape-btn')) {
            btnYes2.classList.add('escape-btn');
            btnYes2.style.position = 'absolute';
            btnYes2.style.margin = '0';
        }
        const containerRect = container2.getBoundingClientRect();
        const btnRect = btnYes2.getBoundingClientRect();
        const maxLeft = Math.max(0, containerRect.width - btnRect.width - 10);
        const maxTop = Math.max(0, containerRect.height - btnRect.height - 10);
        const left = Math.min(maxLeft, Math.max(0, Math.random() * maxLeft));
        const top = Math.min(maxTop, Math.max(0, Math.random() * maxTop));
        btnYes2.style.left = left + 'px';
        btnYes2.style.top = top + 'px';
    }

    btnYes2.addEventListener('mouseenter', teleportYes);
    btnYes2.addEventListener('click', (e) => { e.preventDefault(); teleportYes(); });
    btnYes2.addEventListener('touchstart', (e) => { e.preventDefault(); teleportYes(); });
</script>
</body>
</html>
